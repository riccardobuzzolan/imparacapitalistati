<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Globo e orbita animata per Impara Capitali">
<title>Impara Capitali</title><defs>
<linearGradient id="fire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB33B"/><stop offset="1" stop-color="#FF5E38"/></linearGradient>
<clipPath id="disc"><circle cx="32" cy="32" r="22"/></clipPath></defs>
<style>
#motion{transform-origin:32px 32px;animation:orbit 3.6s linear infinite}
#pin{animation:pin 3.6s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pin{0%,12%,65%,100%{transform:translateY(0)}36%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){#motion,#pin{animation:none}}
</style>
<circle cx="32" cy="32" r="22" fill="#123A8D"/>
<g clip-path="url(#disc)" fill="#51C7F6">
<path d="M12 18 22 13 30 17 28 23 21 25 23 33 18 39 12 35 8 25Z"/>
<path d="M30 40 36 35 44 38 43 47 38 56 33 53Z"/>
<path d="M36 10 46 13 51 23 45 28 39 25 41 18Z"/>
</g>
<path d="M10 32h44M32 10c-11 12-11 32 0 44M32 10c11 12 11 32 0 44" fill="none" stroke="#A7EFFF" stroke-opacity=".45" stroke-width="1.8"/>
<g id="motion" fill="none" stroke="url(#fire)" stroke-width="5.8" stroke-linecap="round">
<path d="M12 19C17 9 29 6 40 9"/><path d="M52 46c-7 10-19 13-30 9"/>
<path d="m36 7 6 3-5 4" stroke-width="4" stroke-linejoin="round"/>
</g>
<g id="pin"><path d="M43 12c-5.5 0-9 4-9 9 0 6.1 9 13 9 13s9-6.9 9-13c0-5-3.5-9-9-9Z" fill="#FFA33E" stroke="#15336C" stroke-width="2"/><circle cx="43" cy="21" r="3.5" fill="#15336C"/></g>
</svg>
