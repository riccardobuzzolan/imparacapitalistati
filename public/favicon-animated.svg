<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Capitali: globo con orbita in movimento">
<style>
#motion{transform-origin:32px 32px;animation:orbit 3.6s linear infinite}
#pin{transform-origin:43px 19px;animation:pin 3.6s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pin{0%,100%{transform:translateY(0)}45%{transform:translateY(-2px)}}
@media(prefers-reduced-motion:reduce){#motion,#pin{animation:none}}
</style>
<circle cx="32" cy="32" r="23" fill="#0E3B8C"/>
<path d="M13 19 23 13l9 4 2 8-8 3-4 10-9-4ZM34 37l10-4 7 7-8 12-7-5ZM38 10l8 5 4 10-7 4-7-7Z" fill="#52C9E3"/>
<path d="M11 32h42M32 9c-8 9-8 37 0 46M32 9c8 9 8 37 0 46" stroke="#BCEEFE" stroke-width="1.8" opacity=".6" fill="none"/>
<g id="motion"><path d="M8 29C11 9 29 4 44 11M55 35C51 53 34 60 19 54" fill="none" stroke="#FF8A22" stroke-width="5" stroke-linecap="round"/><path d="M46 12l-6-2 2 8" fill="none" stroke="#FFCF47" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="pin"><path d="M43 10c-5.6 0-9 4-9 9 0 6 9 14 9 14s9-8 9-14c0-5-3.4-9-9-9Z" fill="#FFB23C" stroke="#072450" stroke-width="1.8"/><circle cx="43" cy="19" r="3.3" fill="#072450"/></g>
</svg>