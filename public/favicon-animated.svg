<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Globo attraversato da un'orbita animata">
<title>Impara Capitali — Orbita</title><defs><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9AD58"/><stop offset="1" stop-color="#EE715F"/></linearGradient><clipPath id="land"><circle cx="32" cy="32" r="19.5"/></clipPath></defs>
<style>
#trail{animation:draw 3.6s cubic-bezier(.38,.01,.22,1) infinite;stroke-dasharray:100;stroke-dashoffset:100}
#spark{transform-origin:32px 32px;animation:orbit 3.6s cubic-bezier(.38,.01,.22,1) infinite}
@keyframes draw{0%,10%{stroke-dashoffset:100;opacity:.35}57%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:100;opacity:.35}}
@keyframes orbit{0%,10%{transform:rotate(-115deg);opacity:0}57%,85%{transform:rotate(140deg);opacity:1}100%{transform:rotate(245deg);opacity:0}}
@media(prefers-reduced-motion:reduce){#trail,#spark{animation:none;stroke-dashoffset:0;opacity:1}}
</style>
<circle cx="32" cy="32" r="20" fill="#133F52"/>
<g fill="#6CC4B5" clip-path="url(#land)"><path d="M11 19 20 14 28 18 29 24 23 28 21 37 15 36 10 30Z"/><path d="M27 40 34 34 42 37 43 45 38 54 32 54Z"/><path d="M36 13 45 16 51 24 44 30 36 25 39 19Z"/></g>
<path d="M13 32h38M32 12c-9 11-9 29 0 40M32 12c9 11 9 29 0 40" fill="none" stroke="#C9F0E8" stroke-opacity=".4" stroke-width="1.5"/>
<path id="trail" d="M12 44C4 24 18 8 34 8c17 0 28 12 25 28-2 11-12 19-24 20" fill="none" stroke="url(#warm)" stroke-width="5.5" stroke-linecap="round" pathLength="100"/>
<g id="spark"><circle cx="32" cy="5" r="3.8" fill="#F9C77F"/></g>
</svg>
