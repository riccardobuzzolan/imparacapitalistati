name: Quality and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - name: Verify the Vercel root build
        run: npm run build
        env:
          VERCEL: "1"
      - run: npm run check
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Report Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if source="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null)"; then
            printf 'Pages publishing source: %s\n' "$source" >> "$GITHUB_STEP_SUMMARY"
            if [ "$source" != "workflow" ]; then
              echo '::warning::Select Settings > Pages > Source > GitHub Actions to prevent the source upload from competing with this compiled build.'
            fi
          else
            echo '::warning::Pages source could not be read. Verify Settings > Pages > Source > GitHub Actions.'
          fi
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
