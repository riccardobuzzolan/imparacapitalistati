name: Quick mobile preview
on:
  pull_request:
    paths:
      - .github/workflows/mobile-map-simple-preview.yml
permissions:
  contents: write
jobs:
  screenshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile and start local site
        run: |
          VERCEL=1 npm run build
          VERCEL=1 npm run preview -- --host 127.0.0.1 > /tmp/map-preview.log 2>&1 &
          sleep 3
      - name: Capture narrow viewport
        run: |
          mkdir -p docs/images
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=7000 --window-size=390,844 --screenshot=docs/images/map-mobile-test.png "http://127.0.0.1:4173/"
          test -s docs/images/map-mobile-test.png
      - name: Store screenshot in PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/map-mobile-test.png
          if ! git diff --cached --quiet; then
            git commit -m "Verifica layout mobile prima del rilascio"
            git push origin HEAD:${{ github.head_ref }}
          fi
