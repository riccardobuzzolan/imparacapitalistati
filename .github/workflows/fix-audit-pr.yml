name: Test compatible security updates
on:
  pull_request:
    paths:
      - .github/workflows/fix-audit-pr.yml
permissions:
  contents: write
jobs:
  audit-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply only compatible lockfile updates
        run: npm audit fix --package-lock-only --no-fund || true
      - name: Reinstall from lockfile
        run: npm ci --no-audit --no-fund
      - name: Require clean high-severity audit and passing tests
        run: |
          npm audit --audit-level=high
          npm run check
      - name: Save verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna dipendenze compatibili dopo audit"
            git push origin HEAD:${{ github.head_ref }}
          fi
